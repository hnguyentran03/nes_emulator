# Help the linker find Homebrew’s libSDL2 on macOS (`brew install sdl2`).
# If build still fails, run: export LIBRARY_PATH="/opt/homebrew/lib:$LIBRARY_PATH" (Apple Silicon)
# or: export LIBRARY_PATH="/usr/local/lib:$LIBRARY_PATH" (Intel).

[target.aarch64-apple-darwin]
rustflags = ["-L", "/opt/homebrew/lib"]

[target.x86_64-apple-darwin]
rustflags = ["-L", "/usr/local/lib"]
