# SDL2 is compiled from source and linked statically (see the `bundled` and
# `static-link` features in Cargo.toml), so no system SDL2 is needed, only
# cmake. The bundled SDL2 declares a CMake minimum version older than CMake 4
# accepts, so tell CMake to configure anyway.
[env]
CMAKE_POLICY_VERSION_MINIMUM = "3.5"
